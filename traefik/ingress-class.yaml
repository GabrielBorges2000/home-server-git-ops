# IngressClass para Traefik (opcional).
# No K3s, o Traefik já costuma registrar uma classe "traefik". Só aplique este arquivo
# se kubectl get ingressclass não listar "traefik".
# Controller: no K3s pode ser "traefik.io/ingress-controller" ou "k3s.io/traefik".
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
