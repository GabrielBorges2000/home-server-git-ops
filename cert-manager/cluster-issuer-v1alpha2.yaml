# ClusterIssuer em cert-manager.io/v1alpha2 (use se o cluster não tiver v1).
# Aplique ESTE arquivo em vez de cluster-issuer.yaml se aparecer erro com
# "cert-manager.io/v1/ClusterIssuer" (ex.: resource not found / no matches for kind).
#
# Mesmo conteúdo que cluster-issuer.yaml, só que com apiVersion v1alpha2.
# Argo CD: sync-wave 1 (veja docs/ARGOCD.md).
---
apiVersion: cert-manager.io/v1alpha2
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@codeborges.com.br
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
