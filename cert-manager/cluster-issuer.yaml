# ClusterIssuer Let's Encrypt (produção).
# OBRIGATÓRIO: instale o cert-manager (e CRDs) ANTES de aplicar este arquivo.
#
# 1) Instalar cert-manager (inclui CRDs):
#    kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.4/cert-manager.yaml
#
# 2) Aguardar os pods ficarem Ready:
#    kubectl wait --for=condition=Ready pods -l app.kubernetes.io/instance=cert-manager -n cert-manager --timeout=120s
#
# 3) Aplicar este ClusterIssuer:
#    kubectl apply -f cert-manager/cluster-issuer.yaml
#
# Se aparecer "Resource not found" ou "no matches for kind ClusterIssuer", os CRDs
# ainda não existem — repita o passo 1 e aguarde o passo 2.
#
# Usa HTTP-01 (funciona com Cloudflare Tunnel apontando para o Ingress).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@codeborges.com.br
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
