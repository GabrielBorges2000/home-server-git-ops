---
# ============================================
# Secret: web-secrets (Frontend envs)
# ============================================
# IMPORTANTE: Este arquivo contém valores sensíveis
#
# Gere os valores base64:
# echo -n 'seu-valor' | base64
#
# Exemplo (produção com domínio):
# echo -n 'https://api.codeborges.com.br' | base64

apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
  namespace: freelancer-manager-dev
  labels:
    app: freelancer-manager
    component: web
    env: dev
type: Opaque
data:
  # Frontend chama a API via domínio público (HTTPS)
  next-public-api-url: aHR0cHM6Ly9hcGkuY29kZWJvcmdlcy5jb20uYnI=
