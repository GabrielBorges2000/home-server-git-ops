---
# ============================================
# Deployment: saas-api (Backend)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-api
  namespace: freelancer-manager-dev
  labels:
    app: freelancer-manager
    component: api
    env: dev
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: freelancer-manager
      component: api
      env: dev
  template:
    metadata:
      labels:
        app: freelancer-manager
        component: api
        env: dev
    spec:
      # 🔐 Secret para autenticação no GHCR
      imagePullSecrets:
        - name: ghcr-secret

      # Ordem de inicialização
      initContainers:
        - name: migrations
          image: ghcr.io/gabrielborges2000/freelancer-manager-backend-dev:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "npx prisma@6.11.1 migrate deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: database-url
                  optional: true

      containers:
        - name: saas-api
          # 📦 Imagem privada do GHCR
          image: ghcr.io/gabrielborges2000/freelancer-manager-backend-dev:latest
          imagePullPolicy: Always
          command: ["node", "dist/server.js"]
          ports:
            - name: http
              containerPort: 3333
              protocol: TCP

          # ⚙️ Variáveis de ambiente
          env:
            - name: NODE_ENV
              value: "development"
            - name: LOG_LEVEL
              value: "debug"
            - name: PORT
              value: "3333"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: database-url
                  optional: true
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: next-public-api-url
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: jwt-secret
                  optional: true
            - name: RESEND_APIKEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: resend-apikey
                  optional: true
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: resend-apikey
                  optional: true
            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: otel-traces-exporter
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: otel-exporter-otlp-endpoint
                  optional: true
            - name: OTEL_SERVICE_NAME
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: otel-service-name
                  optional: true
            - name: OTEL_NODE_ENABLED_INSTRUMENTATIONS
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: otel-node-enabled-instrumentations
                  optional: true

          # 💾 Recursos
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # 🏥 Health Checks
          livenessProbe:
            httpGet:
              path: /health
              port: 3333
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3333
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
