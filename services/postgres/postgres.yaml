# ============================================
# Namespace
# ============================================
apiVersion: v1
kind: Namespace
metadata:
  name: databases

---
# ============================================
# Secret
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: databases
type: Opaque
stringData:
  POSTGRES_USER: docker
  POSTGRES_PASSWORD: docker
  POSTGRES_DB: freelancer-manager

---
# ============================================
# Headless Service (obrigatório para StatefulSet)
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: databases
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      name: postgres

---
# ============================================
# StatefulSet
# ============================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: databases
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: postgres-secrets

          # NÃO mexemos em PGDATA.
          # Deixamos o container oficial trabalhar como foi projetado.

          readinessProbe:
            exec:
              command:
                [
                  "pg_isready",
                  "-h",
                  "localhost",
                  "-U",
                  "docker",
                  "-d",
                  "freelancer-manager",
                ]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                [
                  "pg_isready",
                  "-h",
                  "localhost",
                  "-U",
                  "docker",
                  "-d",
                  "freelancer-manager",
                ]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
