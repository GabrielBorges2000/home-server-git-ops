---
# ============================================
# ConfigMap: PostgreSQL Configuration
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: databases
data:
  POSTGRES_DB: "freelancer-manager"
  POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
  PGDATA: /var/lib/postgresql/data/pgdata
  # Dev-only: aceita conexões sem validação de senha para evitar lock por credenciais divergentes no PVC
  pg_hba.conf: |
    local   all             all                                     trust
    host    all             all             0.0.0.0/0               trust
    host    all             all             ::/0                    trust
