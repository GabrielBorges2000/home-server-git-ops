---
# ============================================
# ConfigMap: PostgreSQL Configuration
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: databases
data:
  POSTGRES_DB: "freelancer-manager"
  POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
  PGDATA: /var/lib/postgresql/data/pgdata
