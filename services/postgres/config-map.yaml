---
# ============================================
# ConfigMap: PostgreSQL Configuration
# ============================================
# Valores consumidos pelo StatefulSet via envFrom.
# PGDATA não é alterado; o container oficial usa /var/lib/postgresql/data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: databases
data:
  POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
  # Dev-only: aceita conexões sem validação de senha (wait-for-postgres e app usam o mesmo user/DB)
  POSTGRES_HOST_AUTH_METHOD: "trust"
