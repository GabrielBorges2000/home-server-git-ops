apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare

---

apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-secret
  namespace: cloudflare
type: Opaque
stringData:
  token: "eyJhIjoiMmQ0OGQ2OWYzN2IzYmQxNTJkYjI4ZDliYmRiODMyZmQiLCJ0IjoiYzg5NGExNTItNzc4Yi00OTZmLTlmOGEtY2UwNmQ5NTYwYzM0IiwicyI6Ik5tRTNZV0U1WW1JdE9URmhNaTAwTmpoakxXRm1NREl0TXpNd01qZzBOMkl4TUdReiJ9"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-secret
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always
