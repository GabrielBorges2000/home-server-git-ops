---
# ============================================
# Secret para autenticação no GHCR
# ============================================
# IMPORTANTE: Substitua o valor .dockerconfigjson com seu token gerado
# 
# Gere com:
# ./generate-ghcr-secret.sh
# 
# OU manualmente:
# 1. Crie auth.json com suas credenciais
# 2. cat auth.json | base64 -w 0
# 3. Cole o resultado abaixo

apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: freelancer-manager-dev
  labels:
    app: freelancer-manager
    env: dev
type: kubernetes.io/dockerconfigjson
data:
  # ⚠️ SUBSTITUA ESTE VALOR
  .dockerconfigjson: eyJhdXRocyI6